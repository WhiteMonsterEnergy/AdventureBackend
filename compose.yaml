
name: AdventureXP
services:
  mysql:
    image: mysql:latest
    container_name: database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: axp
      MYSQL_DATABASE: adventure
      MYSQL_USER: axp
      MYSQL_PASSWORD: axp
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u axp --password=axp
      start_period: 5s
      interval: 1s
      timeout: 20s
      retries: 10

  backend:
    container_name: backend
    build:
      context: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - dbUrl=jdbc:mysql://mysql:3306/adventure
      - dbUsername=axp
      - dbPassword=axp
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    container_name: frontend
    build:
      context: ../AdventureFrontend
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:
