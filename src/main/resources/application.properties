spring.application.name=AdventureBackend

# link to specified database, and create schema if missing
spring.datasource.url=${dbUrl}?createDatabaseIfNotExist=true
spring.datasource.username=${dbUsername}
spring.datasource.password=${dbPassword}

# keep schema up-to-date with project's model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# allow requests to database during execution of other requests
spring.jpa.open-in-view=false

server.port=8081